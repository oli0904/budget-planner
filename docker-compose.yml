services:
  db:
    image: postgres:18
    container_name: budget_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: budget_planner
      POSTGRES_USER: budget_user
      POSTGRES_PASSWORD: budget_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budget_user -d budget_planner"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: